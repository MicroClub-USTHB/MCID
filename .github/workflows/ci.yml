name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - dev
      - main

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.28.1'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter and type checks
        run: pnpm turbo run lint typecheck

      - name: Run unit tests with coverage
        run: pnpm turbo run test:ci

      - name: Build all packages
        run: pnpm turbo run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
          NEXT_PUBLIC_APP_URL: http://localhost:3002

      - name: Check the API docs are up to date
        # `pnpm docs:api` re-exports apps/api/openapi.json and regenerates the reference pages.
        # `git status` (not `git diff`) so a page for a brand-new group counts as a change too.
        run: |
          pnpm docs:api
          changes=$(git status --porcelain -- apps/api/openapi.json apps/web/src/content/docs/api-reference)
          if [ -n "$changes" ]; then
            echo "$changes"
            git --no-pager diff --stat -- apps/api/openapi.json apps/web/src/content/docs/api-reference
            echo "::error::API docs are out of date, run pnpm docs:api and commit the result"
            exit 1
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/*/coverage/
          retention-days: 7   # Auto-delete after 7 days to save storage

  e2e-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: mcdi_test

        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          pnpm --filter @mcdi/api exec node -e "const { Client } = require('pg'); (async () => {
            for (let i = 0; i < 30; i++) {
              try {
                const c = new Client({ connectionString: process.env.DATABASE_URL });
                await c.connect();
                await c.query('select 1');
                await c.end();
                console.log('Postgres is ready');
                return;
              } catch (e) {
                console.log('Waiting for Postgres: ' + e.message);
                await new Promise((r) => setTimeout(r, 2000));
              }
            }
            process.exit(1);
          })();"
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/mcdi_test

      - name: Check migrations re-apply cleanly
        # Production re-runs every migration via psql on each boot (see
        # apps/api/DEPLOY.md), so a second run must succeed.
        run: |
          for f in $(ls apps/api/src/database/migrations/*.sql | sort); do cat "$f"; echo; done > /tmp/migration.sql
          for run in 1 2; do
            psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f /tmp/migration.sql > /dev/null
          done
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/mcdi_test

      - name: Run database migrations
        run: |
          for i in 1 2 3; do
            echo "Migration attempt $i"
            RESET_DB=1 pnpm --filter @mcdi/api run db:migrate && exit 0
            sleep 3
          done
          exit 1
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/mcdi_test

      - name: Run E2E tests
        run: pnpm turbo run test:e2e --filter=@mcdi/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/mcdi_test
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          MC_GUILD_ID: ${{ secrets.MC_GUILD_ID }}
          APP_PORT: 3000
          PORT: 3000

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint-and-test, e2e-tests]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta    # "id" lets other steps reference this step's outputs
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


# Fixed project name: the `docker:*` package scripts address the container as mcid-api-1.
name: mcid

services:
  api:
    build:
      context: ../..                        # repository root — the workspace is bind-mounted below
      dockerfile: apps/api/Dockerfile.dev
    working_dir: /usr/src/app/apps/api
    env_file:
      - .env
    ports:
      - '3000:3000'
      - '4983:4983'

    environment:
      - NODE_ENV=development
      - BASE_URL=http://localhost:3000
      - ADMIN_FRONTEND_URL=http://localhost:3000/admin
      - DISCORD_ADMIN_CALLBACK_URL=http://localhost:3000/api/auth/discord/callback
      - DATABASE_URL=postgresql://myuser:mypassword@database:5432/mcid
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password
      - REDIS_KEY_PREFIX=mcid
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=mcid-files
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1

    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

    command: sh -lc "corepack enable && pnpm install --filter '@mcid/api...' && until pnpm run db:push; do echo 'Waiting for database schema...' && sleep 2; done && pnpm exec turbo run dev --filter=@mcid/api --ui=stream"

    volumes:
      - ../..:/usr/src/app
      # keep the container's Linux node_modules out of the host checkout
      - /usr/src/app/node_modules
      - /usr/src/app/apps/api/node_modules
      - /usr/src/app/packages/contracts/node_modules
      - /usr/src/app/packages/eslint-config/node_modules
      - /usr/src/app/packages/typescript-config/node_modules

  database:
    image: postgres:16-alpine
    restart: always
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mcid
    volumes:
      - my_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mcid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--requirepass', 'redis_password']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # S3-compatible object storage for inbound webhook file uploads
  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ':9001'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mcid-files"

volumes:
  my_db_data:
  redis_data:
  minio_data:

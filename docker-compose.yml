services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
      - '4983:4983'

    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://myuser:mypassword@database:5432/mcdi
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password
      - REDIS_KEY_PREFIX=mcdi

    depends_on:
      - database
      - redis

    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  database:
    image: postgres:16-alpine
    restart: always
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mcdi
    volumes:
      - my_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--requirepass', 'redis_password']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  my_db_data:
  redis_data:

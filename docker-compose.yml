services:
  api:
    build:
      context: .                  # Look for files in the current directory
      dockerfile: Dockerfile.dev   # Use our specific development blueprint
    env_file:
      - .env
    ports:
      - '3000:3000'
      - '4983:4983'

    environment:
      - NODE_ENV=development
      - BASE_URL=http://localhost:3000
      - ADMIN_FRONTEND_URL=http://localhost:3000/admin
      - DISCORD_ADMIN_CALLBACK_URL=http://localhost:3000/api/auth/discord/callback
      - DATABASE_URL=postgresql://myuser:mypassword@database:5432/mcdi
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password
      - REDIS_KEY_PREFIX=mcdi

    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

    command: sh -lc "corepack enable && pnpm install && until pnpm run db:push; do echo 'Waiting for database schema...' && sleep 2; done && pnpm run start:dev"

    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  database:
    image: postgres:16-alpine
    restart: always
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mcdi
    volumes:
      - my_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mcdi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--requirepass', 'redis_password']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  my_db_data:
  redis_data:
